username: TestBot1
archetype: pvper
rank: default
skill_tier: 2

# 0..1 drive to found a faction vs. join an existing one.
# High ambition = more likely to be the founder.
ambition: 0.75

faction_preferences:
  style: short-aggressive         # hint to the LLM faction-name prompt
  themes: ["wolves", "skulls", "edge"]

voice:
  tone: aggressive
  greeting: "hi"
  catchphrases:
    - "git gud"
    - "ez"
    - "ratio"
  typo_rate: 0.04
  caps_when_tilted: 0.30
  signature_rate: 0.15
  punctuation: minimal

host: localhost
port: 25565
version: "1.8.9"
auth: offline

redis:
  host: localhost
  port: 6379

spawn:
  x: 0
  y: 64
  z: 0

arena:
  x: 0
  y: 64
  z: 0

# Skill tier 2 — casual PvPer. Humans of roughly 1-2 months experience
# should beat this bot in a 1v1 most of the time. Missed block-hits,
# telegraphed approaches, fumbled pots.
backstory: >
  Grew up on Hypixel BedWars. Claims 300+ wins, nobody's verified. Always
  queues, always trash-talks, always one rematch away from proving
  something.

values:
  risk_tolerance: 0.8
  social_preference: 0.5
  material_greed: 0.4
  loyalty: 0.3
  curiosity: 0.4

schedule:
  primary_hours: [18, 23]     # after-dinner window
  secondary_hours: [13, 17]   # weekend afternoons
  session_minutes: [45, 150]
  weekend_boost: true

combat:
  reaction_ms_min: 350
  reaction_ms_max: 500
  aim_error_deg: 5.0
  cps: 6
  block_hit_rate: 0.20
  pot_at_hp: 14
  pot_success_rate: 0.50
  combo_follow_rate: 0.50
  flee_at_hp: 6
  preferred_weapon: sword
