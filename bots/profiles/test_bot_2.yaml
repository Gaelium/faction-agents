# Skill tier 4 — axe-main who leans on mcMMO Axes (Armor Impact) to melt
# your armor faster than your sword melts theirs. In 1.8 PvP, axes hit
# HARDER than swords but can't block-hit (blocking is a sword-only
# right-click). That structural gap is the tell:
#
#   • No block-hit while they're on axe → they tank every hit you land.
#     Trade HP aggressively; sword-block on each of their swings and
#     you'll pull ahead.
#   • High combo_follow_rate means they chase hard with sprint-resets
#     — strafe against their knockback angle to reset range.
#   • Pot at HP 14 but in 1.8 there's a ~150ms swap window between axe
#     and heal item; force the pot early with back-to-back crits.
#   • No jump-crit pattern baked in — 1.8 crits on any falling attack,
#     and we don't currently model them, so don't expect the tell from
#     later-version axe players.
backstory: >
  Been on the server since opening day. Obsessed with mcMMO Axes, maxed
  the skill, now picks fights to show off Armor Impact. Speaks with
  condescending confidence.

